version = 0.1

[dev.global.parameters]
stack_name = "mola-dev"
region = "af-south-1"
profile = "default"

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
parameter_overrides = "ConfirmWindowSeconds=30 DropBackPlaces=3 MaxMisses=2 TicketLifetimeHours=12"
# StaffKeyHash goes on the command line. A command-line --parameter-overrides replaces this whole
# list, so pass the other four parameters with it (README.md, "Deploy it").

[demo.global.parameters]
stack_name = "mola-demo"
region = "af-south-1"
profile = "default"

[demo.build.parameters]
cached = true
parallel = true

[demo.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
parameter_overrides = "ConfirmWindowSeconds=120 DropBackPlaces=3 MaxMisses=2 TicketLifetimeHours=12"
