AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mola - a virtual queue for walk-in offices. Everything here bills per use; nothing runs while the office is closed.

Parameters:
  ConfirmWindowSeconds:
    Type: Number
    Default: 120
    MinValue: 10
    MaxValue: 600
    Description: How long a called patron has to tap Confirm.
  DropBackPlaces:
    Type: Number
    Default: 3
    MinValue: 1
    Description: How many places a patron who misses their turn moves back.
  MaxMisses:
    Type: Number
    Default: 2
    MinValue: 0
    Description: Missed turns allowed before a ticket closes as a no-show.
  TicketLifetimeHours:
    Type: Number
    Default: 12
    MinValue: 1
    MaxValue: 24
    Description: After this a ticket is treated as gone, which clears yesterday's queue.
  StaffKeyHash:
    Type: String
    NoEcho: true
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: SHA-256 (hex) of the staff key. The key itself never enters the stack.
  NovaRegion:
    Type: String
    Default: eu-central-1
    AllowedPattern: '^[a-z]{2}(-[a-z]+)+-[0-9]+$'
    Description: Source region for Amazon Nova inference.
  NovaFoundationModel:
    Type: String
    Default: amazon.nova-2-lite-v1:0
    Description: Foundation model used through its global inference profile.
  OfficeTimeZone:
    Type: String
    Default: Africa/Johannesburg
    Description: Office time zone for the day summary.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional address told when a called-ticket execution fails.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: backend/
    Environment:
      Variables:
        TABLE_NAME: !Ref MolaTable
        WS_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
        # Built from the name rather than !Ref, so the functions the state machine invokes can
        # know its ARN without a dependency cycle (infra.md 6.1).
        STATE_MACHINE_ARN: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-called-ticket
        CONFIRM_WINDOW_SECONDS: !Ref ConfirmWindowSeconds
        DROP_BACK_PLACES: !Ref DropBackPlaces
        MAX_MISSES: !Ref MaxMisses
        TICKET_LIFETIME_HOURS: !Ref TicketLifetimeHours

Resources:
  # ------------------------------------------------------------------ data ----
  MolaTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ------------------------------------------------------------- websocket ----
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  ConnectionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectionFunction.Arn}/invocations

  ClientIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClientFunction.Arn}/invocations

  StaffIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StaffFunction.Arn}/invocations

  AssistIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AssistFunction.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub integrations/${ConnectionIntegration}
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub integrations/${ConnectionIntegration}
  WatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: watch
      Target: !Sub integrations/${ClientIntegration}
  PingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: ping
      Target: !Sub integrations/${ClientIntegration}
  JoinRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: join
      Target: !Sub integrations/${ClientIntegration}
  ResumeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: resume
      Target: !Sub integrations/${ClientIntegration}
  ConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: confirm
      Target: !Sub integrations/${ClientIntegration}
  LeaveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: leave
      Target: !Sub integrations/${ClientIntegration}
  CallNextRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: callNext
      Target: !Sub integrations/${StaffIntegration}
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub integrations/${ClientIntegration}

  AskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: ask
      Target: !Sub integrations/${AssistIntegration}
  NotesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: notes
      Target: !Sub integrations/${AssistIntegration}
  DaySummaryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: daySummary
      Target: !Sub integrations/${AssistIntegration}
  SaveNotesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: saveNotes
      Target: !Sub integrations/${StaffIntegration}

  ProdStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [ConnectRoute, DisconnectRoute, WatchRoute, PingRoute, JoinRoute, ResumeRoute, ConfirmRoute, LeaveRoute, CallNextRoute, DefaultRoute, AskRoute, NotesRoute, DaySummaryRoute, SaveNotesRoute]
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  ConnectionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectionFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
  ClientInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ClientFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  StaffInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StaffFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  AssistInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AssistFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # ------------------------------------------------------------- functions ----
  ConnectionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /mola/${AWS::StackName}/connection
      RetentionInDays: 14
  ConnectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: connection.handler
      LoggingConfig: { LogFormat: JSON, LogGroup: !Ref ConnectionLogGroup }
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
              Resource: !GetAtt MolaTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        # ESM bundles have no require(); the AWS SDK's CommonJS parts need one at run time.
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/connection.ts]

  ClientLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /mola/${AWS::StackName}/client
      RetentionInDays: 14
  ClientFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: client.handler
      LoggingConfig: { LogFormat: JSON, LogGroup: !Ref ClientLogGroup }
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt MolaTable.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/prod/POST/@connections/*
            # SendTaskSuccess/Failure accept no resource type (Service Authorization Reference), so
            # they cannot be scoped; the task token itself is the capability (infra.md 6.2).
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        # ESM bundles have no require(); the AWS SDK's CommonJS parts need one at run time.
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/client.ts]


  StaffLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /mola/${AWS::StackName}/staff
      RetentionInDays: 14
  StaffFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: staff.handler
      LoggingConfig: { LogFormat: JSON, LogGroup: !Ref StaffLogGroup }
      Environment:
        Variables:
          STAFF_KEY_SHA256: !Ref StaffKeyHash
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt MolaTable.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/prod/POST/@connections/*
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-called-ticket

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/staff.ts]

  AssistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /mola/${AWS::StackName}/assist
      RetentionInDays: 14
  AssistFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: assist.handler
      LoggingConfig: { LogFormat: JSON, LogGroup: !Ref AssistLogGroup }
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          NOVA_REGION: !Ref NovaRegion
          NOVA_MODEL_ID: !Sub global.${NovaFoundationModel}
          OFFICE_TIME_ZONE: !Ref OfficeTimeZone
          STAFF_KEY_SHA256: !Ref StaffKeyHash
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt MolaTable.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/prod/POST/@connections/*
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${NovaRegion}:${AWS::AccountId}:inference-profile/global.${NovaFoundationModel}
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref NovaRegion
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${NovaRegion}::foundation-model/${NovaFoundationModel}
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref NovaRegion
                  bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${NovaRegion}:${AWS::AccountId}:inference-profile/global.${NovaFoundationModel}
            # Global cross-Region inference requires this third, region-less foundation model ARN.
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:::foundation-model/${NovaFoundationModel}
              Condition:
                StringEquals:
                  aws:RequestedRegion: unspecified
                  bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${NovaRegion}:${AWS::AccountId}:inference-profile/global.${NovaFoundationModel}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/assist.ts]

  NotifyCalledLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /mola/${AWS::StackName}/notify-called
      RetentionInDays: 14
  NotifyCalledFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: notify-called.handler
      LoggingConfig: { LogFormat: JSON, LogGroup: !Ref NotifyCalledLogGroup }
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt MolaTable.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/prod/POST/@connections/*
            - Effect: Allow
              Action: states:SendTaskFailure
              Resource: '*'

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/notify-called.ts]

  MissedTurnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /mola/${AWS::StackName}/missed-turn
      RetentionInDays: 14
  MissedTurnFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: missed-turn.handler
      LoggingConfig: { LogFormat: JSON, LogGroup: !Ref MissedTurnLogGroup }
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt MolaTable.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/prod/POST/@connections/*
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-called-ticket

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node24
        Minify: true
        Sourcemap: true
        OutExtension: [.js=.mjs]
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/missed-turn.ts]

  # ------------------------------------------------------------ call flow ----
  CalledTicketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # The /aws/vendedlogs/states prefix stops Step Functions adding a CloudWatch Logs resource
      # policy per deploy (those are capped per region).
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}-called-ticket
      RetentionInDays: 14
  CalledTicketStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AWS::StackName}-called-ticket
      Type: STANDARD
      DefinitionUri: backend/statemachine/called-ticket.asl.json
      DefinitionSubstitutions:
        NotifyCalledFunctionArn: !GetAtt NotifyCalledFunction.Arn
        MissedTurnFunctionArn: !GetAtt MissedTurnFunction.Arn
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup: { LogGroupArn: !GetAtt CalledTicketLogGroup.Arn }
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref NotifyCalledFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref MissedTurnFunction }
        # Step Functions log delivery needs these account-level actions (no resource scoping exists).
        - Statement:
            - Effect: Allow
              Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies, logs:DescribeLogGroups]
              Resource: '*'

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail
  ExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A called-ticket execution failed; a ticket may be stuck as called.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - { Name: StateMachineArn, Value: !Ref CalledTicketStateMachine }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  # ------------------------------------------------------------------- web ----
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-headers
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; connect-src 'self' wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed CachingOptimized
          ResponseHeadersPolicyId: !Ref WebHeaders
        # /screen and any unknown path are client-side routes served by index.html.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

Outputs:
  WebSocketUrl:
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  WebsiteUrl:
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
